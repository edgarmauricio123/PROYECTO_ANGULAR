<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <title>Dashboard</title>

    <style>
      body {
        margin: 0;
        background: #f3f4f6;
        font-family: Arial, sans-serif;
      }

      /* SIDEBAR */
      .sidebar {
        width: 240px;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background: #4f46e5;
        color: white;
        padding: 20px;
      }

      .sidebar a {
        display: block;
        padding: 12px;
        color: white;
        border-radius: 10px;
        margin-bottom: 10px;
        text-decoration: none;
      }

      .sidebar a:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* HEADER */
      .header {
        margin-left: 240px;
        padding: 15px 30px;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ddd;
      }

      /* CONTENT */
      .content {
        margin-left: 240px;
        padding: 20px;
      }

      /* CARDS */
      .card-dashboard {
        border-radius: 15px;
        color: white;
        padding: 20px;
      }

      .card1 {
        background: linear-gradient(45deg, #6366f1, #8b5cf6);
      }
      .card2 {
        background: linear-gradient(45deg, #3b82f6, #60a5fa);
      }
      .card3 {
        background: linear-gradient(45deg, #10b981, #34d399);
      }
      .card4 {
        background: linear-gradient(45deg, #84cc16, #a3e635);
      }
    </style>
  </head>

  <body>
    <!-- SIDEBAR -->
    <div class="sidebar">
      <a href="#"><i class="bi bi-house-door me-2"></i>Dashboard</a>
      <a href="#"><i class="bi bi-file-earmark me-2"></i>Applications</a>
      <a href="#"><i class="bi bi-chat me-2"></i>Messages</a>
      <a href="#"><i class="bi bi-bar-chart me-2"></i>Statistics</a>
    </div>

    <div class="content">
      <!-- CARDS -->
      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div class="card-dashboard card1">
            <h6>Alumnos</h6>
            <h2>86</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-dashboard card2">
            <h6>Maestros</h6>
            <h2>75</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-dashboard card3">
            <h6>Materias</h6>
            <h2>45,673</h2>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-dashboard card4">
            <h6>Total</h6>
            <h2>93</h2>
          </div>
        </div>
      </div>

      <!-- CARD GRANDE -->
      <div class="cold-md-19">
        <h5>Vacancy Stats</h5>
        <div id="chart">
          <canvas id="miGrafica"></canvas>
        </div>
      </div>
      <br /><br /><br /><br />

      </div>
    </div>
  </body>
</html>
